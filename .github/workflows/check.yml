name: Check literature automation

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: python -m unittest discover -s tests -v
      - run: python scripts/render_library.py --check
      - run: python scripts/render_bands.py --check
      - run: node --check literature.js
      - run: node --check library-core.js
      - run: node --test tests/library-core.test.cjs
      - run: node --check bands.js
      - run: node --check band-core.js
      - run: node --test tests/band-core.test.cjs
