name: One-time commit email cleanup

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  rewrite-history:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0
      - name: Replace public author emails without changing site files
        shell: bash
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD^)" = 'c18b2b3a3243a35c3c8f64b8863a02e9bd2d2ca2'
          test "$(git symbolic-ref --short HEAD)" = 'main'
          old_head="$(git rev-parse HEAD)"
          original_tree="$(git rev-parse HEAD^{tree})"

          export FILTER_BRANCH_SQUELCH_WARNING=1
          git filter-branch --force --env-filter '
            case "$GIT_AUTHOR_EMAIL" in
              *@users.noreply.github.com|noreply@github.com) ;;
              *) GIT_AUTHOR_EMAIL="312569959+terryliu0125-ship-it@users.noreply.github.com"; export GIT_AUTHOR_EMAIL ;;
            esac
          ' -- main

          test "$(git rev-parse HEAD^{tree})" = "$original_tree"
          test "$(git rev-list main --count)" = '12'
          if git log main --format='%ae%n%ce' | grep -Ev '@users\.noreply\.github\.com$|^noreply@github\.com$'; then
            echo '::error::A non-private email remains in commit metadata.'
            exit 1
          fi
          git push --force-with-lease="refs/heads/main:$old_head" origin HEAD:refs/heads/main
